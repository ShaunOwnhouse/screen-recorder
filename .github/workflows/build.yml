name: Build apps

on:
  push:
    # Every branch is built and tested; only main is published (see the "refs/heads/main" checks below).
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build gets a higher version than the one before, which is what lets an installed copy see it as an update.
  APP_VERSION: 1.1.${{ github.run_number }}
  RELEASE_PAGE: https://github.com/${{ github.repository }}/releases/tag/latest-build
  # Where installed copies look for updates (see README → Updates). By default this repository's "updates" release; because it
  # is private, installed copies can't read it, so point UPDATE_FEED_REPO at a public repo (and add the UPDATE_FEED_TOKEN secret).
  FEED_REPO: ${{ vars.UPDATE_FEED_REPO || github.repository }}
  UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL || format('https://github.com/{0}/releases/download/updates', vars.UPDATE_FEED_REPO || github.repository) }}

jobs:
  # GitHub only gives a repository a fixed amount of artifact storage, and every build is ~450 MB. Without this the quota fills
  # up ("Artifact storage quota has been hit") and new builds can no longer be uploaded. Only the newest build is kept.
  tidy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      # Finished installers are published to ONE fixed page (Releases → "Latest build"). Release files don't use the Actions
      # artifact storage, and the link never changes.
      - name: Make sure the Latest build release exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest-build --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --prerelease \
              --title "Latest build" --notes "Newest build of Screen Snap from the main branch."
          # The update feed: installed copies read latest.yml from here and download the new installer.
          export GH_TOKEN="${{ secrets.UPDATE_FEED_TOKEN || github.token }}"
          gh release view updates --repo "$FEED_REPO" >/dev/null 2>&1 || \
            gh release create updates --repo "$FEED_REPO" --prerelease \
              --title "Update feed (used by the app, not for downloading)" --notes "Files the installed app reads to update itself."

      - name: Delete artifacts from earlier runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            echo "deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

  windows:
    needs: tidy
    # Only main is built: branch pushes used to build everything twice, which used up the free build minutes.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Signs automatically once signing secrets are added (see README → "Removing the security warning").
      - name: Package
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          args=(--win --publish never "-c.extraMetadata.version=$APP_VERSION" "-c.extraMetadata.releasePage=$RELEASE_PAGE" -c.publish.provider=generic "-c.publish.url=$UPDATE_FEED_URL")
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            args+=(
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            )
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with code-signing certificate"
          else
            echo "No signing secrets set: building unsigned (SmartScreen will warn)"
          fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npx electron-builder "${args[@]}"

      # Windows' own media stack (used by Media Player and Photos) must be present to test playback.
      - name: Make sure Windows Media Foundation is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation | Format-List
          }
          Get-ChildItem "$env:SystemRoot\System32" -Filter 'mf*.dll' | Select-Object -First 8 Name | Format-Table -HideTableHeaders
          Get-Command powershell.exe | Select-Object -ExpandProperty Source
          Add-Type -AssemblyName System.Runtime.WindowsRuntime
          [Environment]::OSVersion.VersionString

      # Runs the real packaged app: record (with a simulated microphone), review, edit and save, then
      # checks every saved file — decodes it fully and opens it with Windows' own media stack.
      - name: End-to-end test of the packaged app
        shell: bash
        run: node test/e2e/run.cjs "dist/win-unpacked/Screen Snap.exe"

      # Proves the update path on a real Windows machine: install the build silently, let it find a newer build on a local
      # feed, download it, restart into it, and check that the new version runs with the old settings.
      - name: Update test (install, update, relaunch)
        shell: bash
        run: node test/e2e/update.cjs "dist/Screen-Snap-Setup-$APP_VERSION.exe"

      # The same update test, but the newer build is hosted on GitHub itself (one fixed release, "update-test") and downloaded through
      # GitHub's real download links, redirects and partial downloads included — the way installed copies get their updates.
      # It cannot hold up a release while it is being proven; a failure shows in this step.
      - name: Update test through GitHub's real download links
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node test/e2e/update.cjs "dist/Screen-Snap-Setup-$APP_VERSION.exe" --github

      # Only reached when the end-to-end test above passed. Publishes the installers the test just ran.
      - name: Publish the Windows build to the Latest build release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-build dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          # The update feed: the installer + its block map first, then latest.yml (which points at them). Older installers are removed.
          ls -la dist
          feed() { GH_TOKEN="${{ secrets.UPDATE_FEED_TOKEN || github.token }}" gh "$@" --repo "$FEED_REPO"; }
          feed release upload updates "dist/Screen-Snap-Setup-$APP_VERSION.exe" "dist/Screen-Snap-Setup-$APP_VERSION.exe.blockmap" --clobber
          feed release upload updates dist/latest.yml --clobber
          for old in $(feed release view updates --json assets --jq '.assets[].name' | grep -E '^Screen-Snap-Setup-' | grep -v "$APP_VERSION"); do
            feed release delete-asset updates "$old" --yes || true
          done
          CHECKS=$(node -e "const r=require('./test-results/e2e/results.json');console.log(r.filter(x=>x.ok).length+'/'+r.length)")
          gh release edit latest-build --repo "$GITHUB_REPOSITORY" --notes "Newest build of Screen Snap (commit ${GITHUB_SHA:0:7}).

          **Windows:** the exact installers attached here were run through an end-to-end test on a real Windows machine (record, review, edit, save in every format, screenshots, shortcuts): $CHECKS checks passed. The same run also proved the self-update: it installed an older build, found this newer one, downloaded it, restarted into it and kept its settings.
          **macOS:** the \`.dmg\` files are built but not yet tested on a Mac."

      # Reads the update feed the way an installed copy does (the real download address, redirects and all) and checks the installer
      # that was just published is complete and exactly what latest.yml says, so a broken feed is noticed at once.
      - name: Check the published update feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: node scripts/check-feed.cjs "$UPDATE_FEED_URL" "$APP_VERSION"

      - name: Upload end-to-end results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: |
            test-results/e2e
            test-results/update
          if-no-files-found: ignore
          retention-days: 2

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: screen-snap-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

      # Microsoft Store package. Microsoft signs it during certification, so no certificate is needed.
      # Uses the app identity from Partner Center (repository variables); without them it still builds
      # a test package with a placeholder identity to prove packaging works, but doesn't upload it.
      - name: Package for Microsoft Store
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          if [ -n "$STORE_IDENTITY_NAME" ]; then
            echo "STORE_READY=1" >> "$GITHUB_ENV"
          else
            echo "No Store identity variables yet: building a placeholder test package"
            STORE_IDENTITY_NAME=Placeholder.ScreenRecorder
            STORE_PUBLISHER="CN=00000000-0000-0000-0000-000000000000"
            STORE_PUBLISHER_DISPLAY_NAME=Placeholder
            STORE_DISPLAY_NAME="Screen Snap"
          fi
          npx electron-builder --win appx --publish never "-c.extraMetadata.version=$APP_VERSION" \
            "-c.appx.identityName=$STORE_IDENTITY_NAME" \
            "-c.appx.publisher=$STORE_PUBLISHER" \
            "-c.appx.publisherDisplayName=$STORE_PUBLISHER_DISPLAY_NAME" \
            "-c.appx.displayName=${STORE_DISPLAY_NAME:-Screen Snap}"

      - name: Declare microphone and camera in Store package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist -Filter *.appx | Select-Object -First 1
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'appx'
          & $makeappx.FullName unpack /p $pkg.FullName /d $dir /o | Out-Null
          # makeappx regenerates these on pack and refuses to pack them; brackets need -LiteralPath.
          foreach ($f in 'AppxBlockMap.xml', '[Content_Types].xml', 'AppxSignature.p7x') {
            Remove-Item -LiteralPath (Join-Path $dir $f) -ErrorAction SilentlyContinue
          }
          $manifest = Join-Path $dir 'AppxManifest.xml'
          $xml = Get-Content $manifest -Raw
          foreach ($cap in 'microphone', 'webcam') {
            if ($xml -notmatch "DeviceCapability Name=`"$cap`"") {
              $xml = $xml -replace '</Capabilities>', "  <DeviceCapability Name=`"$cap`"/></Capabilities>"
            }
          }
          Set-Content -Path $manifest -Value $xml -Encoding UTF8
          & $makeappx.FullName pack /d $dir /p $pkg.FullName /o | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
          Select-String -Path $manifest -Pattern 'Capability'

      - uses: actions/upload-artifact@v7
        if: env.STORE_READY == '1'
        continue-on-error: true
        with:
          name: screen-snap-microsoft-store
          path: dist/*.appx
          if-no-files-found: error
          retention-days: 3

  mac:
    needs: tidy
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build native helper (universal)
        run: |
          mkdir -p build resources/mac
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos11.0 \
              -Xlinker -weak_framework -Xlinker ScreenCaptureKit \
              native/mac/MacHelper.swift -o build/mac-helper-$arch
          done
          lipo -create build/mac-helper-arm64 build/mac-helper-x86_64 -output resources/mac/mac-helper
          codesign --force --sign - resources/mac/mac-helper
          resources/mac/mac-helper displays

      - run: npm run build

      # Signs with a Developer ID and notarises once Apple secrets are added; otherwise ad-hoc signs.
      - name: Package (Apple Silicon + Intel)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with Developer ID certificate"
          else
            echo "No Apple signing secrets set: ad-hoc signing (Gatekeeper will warn)"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$CSC_LINK" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi

          mac_args=(--publish never "-c.extraMetadata.version=$APP_VERSION" "-c.extraMetadata.releasePage=$RELEASE_PAGE" -c.publish.provider=generic "-c.publish.url=$UPDATE_FEED_URL")
          if [ -n "$CSC_LINK" ]; then mac_args+=("-c.extraMetadata.signedBuild=true"); fi
          npx electron-builder --mac --arm64 "${mac_args[@]}"

          # The installer skips if a binary exists, so remove the Apple Silicon one first.
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q x86_64
          npx electron-builder --mac --x64 "${mac_args[@]}"

      - name: Publish the macOS build to the Latest build release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-build dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          ls -la dist
          # The Mac side of the update feed (until the app is code-signed, Macs are only told that a new version exists).
          if [ -f dist/latest-mac.yml ]; then
            GH_TOKEN="${{ secrets.UPDATE_FEED_TOKEN || github.token }}" gh release upload updates dist/latest-mac.yml --clobber --repo "$FEED_REPO"
          fi

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: screen-snap-mac
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3
