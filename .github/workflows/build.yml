name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Signs automatically once signing secrets are added (see README → "Removing the security warning").
      - name: Package
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          args=(--win --publish never)
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            args+=(
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
            )
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with code-signing certificate"
          else
            echo "No signing secrets set: building unsigned (SmartScreen will warn)"
          fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npx electron-builder "${args[@]}"

      # Windows' own media stack (used by Media Player and Photos) must be present to test playback.
      - name: Make sure Windows Media Foundation is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation | Format-List
          }
          Get-ChildItem "$env:SystemRoot\System32" -Filter 'mf*.dll' | Select-Object -First 8 Name | Format-Table -HideTableHeaders
          Get-Command powershell.exe | Select-Object -ExpandProperty Source
          Add-Type -AssemblyName System.Runtime.WindowsRuntime
          [Environment]::OSVersion.VersionString

      # Runs the real packaged app: record (with a simulated microphone), review, edit and save, then
      # checks every saved file — decodes it fully and opens it with Windows' own media stack.
      - name: End-to-end test of the packaged app
        shell: bash
        run: node test/e2e/run.cjs "dist/win-unpacked/Screen Recorder.exe"

      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: test-results/e2e
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: screen-recorder-windows
          path: dist/*.exe
          if-no-files-found: error

      # Microsoft Store package. Microsoft signs it during certification, so no certificate is needed.
      # Uses the app identity from Partner Center (repository variables); without them it still builds
      # a test package with a placeholder identity to prove packaging works, but doesn't upload it.
      - name: Package for Microsoft Store
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          if [ -n "$STORE_IDENTITY_NAME" ]; then
            echo "STORE_READY=1" >> "$GITHUB_ENV"
          else
            echo "No Store identity variables yet: building a placeholder test package"
            STORE_IDENTITY_NAME=Placeholder.ScreenRecorder
            STORE_PUBLISHER="CN=00000000-0000-0000-0000-000000000000"
            STORE_PUBLISHER_DISPLAY_NAME=Placeholder
            STORE_DISPLAY_NAME="Screen Recorder"
          fi
          npx electron-builder --win appx --publish never \
            "-c.appx.identityName=$STORE_IDENTITY_NAME" \
            "-c.appx.publisher=$STORE_PUBLISHER" \
            "-c.appx.publisherDisplayName=$STORE_PUBLISHER_DISPLAY_NAME" \
            "-c.appx.displayName=${STORE_DISPLAY_NAME:-Screen Recorder}"

      - name: Declare microphone in Store package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist -Filter *.appx | Select-Object -First 1
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'appx'
          & $makeappx.FullName unpack /p $pkg.FullName /d $dir /o | Out-Null
          # makeappx regenerates these on pack and refuses to pack them; brackets need -LiteralPath.
          foreach ($f in 'AppxBlockMap.xml', '[Content_Types].xml', 'AppxSignature.p7x') {
            Remove-Item -LiteralPath (Join-Path $dir $f) -ErrorAction SilentlyContinue
          }
          $manifest = Join-Path $dir 'AppxManifest.xml'
          $xml = Get-Content $manifest -Raw
          if ($xml -notmatch 'DeviceCapability Name="microphone"') {
            $xml = $xml -replace '</Capabilities>', '  <DeviceCapability Name="microphone"/></Capabilities>'
            Set-Content -Path $manifest -Value $xml -Encoding UTF8
          }
          & $makeappx.FullName pack /d $dir /p $pkg.FullName /o | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
          Select-String -Path $manifest -Pattern 'Capability'

      - uses: actions/upload-artifact@v7
        if: env.STORE_READY == '1'
        with:
          name: screen-recorder-microsoft-store
          path: dist/*.appx
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build native helper (universal)
        run: |
          mkdir -p build resources/mac
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos11.0 \
              -Xlinker -weak_framework -Xlinker ScreenCaptureKit \
              native/mac/MacHelper.swift -o build/mac-helper-$arch
          done
          lipo -create build/mac-helper-arm64 build/mac-helper-x86_64 -output resources/mac/mac-helper
          codesign --force --sign - resources/mac/mac-helper
          resources/mac/mac-helper displays

      - run: npm run build

      # Signs with a Developer ID and notarises once Apple secrets are added; otherwise ad-hoc signs.
      - name: Package (Apple Silicon + Intel)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with Developer ID certificate"
          else
            echo "No Apple signing secrets set: ad-hoc signing (Gatekeeper will warn)"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$CSC_LINK" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi

          npx electron-builder --mac --arm64 --publish never

          # The installer skips if a binary exists, so remove the Apple Silicon one first.
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q x86_64
          npx electron-builder --mac --x64 --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: screen-recorder-mac
          path: dist/*.dmg
          if-no-files-found: error
