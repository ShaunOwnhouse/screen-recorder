<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:" />
    <title>Countdown</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .ring {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(16, 18, 22, 0.82);
        border: 4px solid #ef4444;
        display: grid;
        place-items: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      .note {
        max-width: 290px;
        text-align: center;
        font-size: 12.5px;
        line-height: 1.4;
        color: #e8eaee;
        background: rgba(16, 18, 22, 0.88);
        border: 1px solid #2a2f39;
        border-radius: 10px;
        padding: 7px 12px;
      }
      #n {
        color: #fff;
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #n.tick {
        animation: pop 0.9s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.35);
          opacity: 0;
        }
        20% {
          transform: scale(1);
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          transform: scale(0.85);
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div class="ring"><span id="n"></span></div>
    <div id="note" class="note" hidden></div>
    <script type="module" src="./countdown.ts"></script>
  </body>
</html>
