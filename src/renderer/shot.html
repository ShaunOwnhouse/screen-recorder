<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' blob: data:"
    />
    <title>Review screenshot</title>
    <link rel="stylesheet" href="./editor.css" />
    <link rel="stylesheet" href="./shot.css" />
  </head>
  <body>
    <div class="editor shot">
      <header class="bar">
        <div class="title">
          <h1>Review screenshot</h1>
          <span id="info" class="muted"></span>
        </div>
        <div class="title-actions">
          <button id="discard" type="button" class="danger-ghost">Discard</button>
        </div>
      </header>

      <section id="wrap" class="stage-wrap shot-wrap">
        <div id="box" class="canvas-box">
          <canvas id="view"></canvas>
          <div id="crop" class="crop-layer" hidden>
            <div id="crop-box" class="crop-box">
              <span class="crop-size" id="crop-size"></span>
              <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i>
              <i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
            </div>
          </div>
        </div>
        <div id="stage-msg" class="stage-msg" hidden></div>
      </section>

      <section class="tools">
        <div class="group">
          <button id="t-crop" type="button" class="ghost" aria-pressed="false">Crop</button>
          <button id="zoom-fit" type="button" class="ghost" aria-pressed="true">Zoom to fit</button>
          <button id="zoom-100" type="button" class="ghost" aria-pressed="false">100 %</button>
        </div>
        <div class="group">
          <button id="t-pen" type="button" class="ghost tool" data-tool="pen" aria-pressed="false">Pen</button>
          <button id="t-hl" type="button" class="ghost tool" data-tool="hl" aria-pressed="false">Highlighter</button>
          <button id="t-arrow" type="button" class="ghost tool" data-tool="arrow" aria-pressed="false">Arrow</button>
          <button id="t-text" type="button" class="ghost tool" data-tool="text" aria-pressed="false">Text</button>
        </div>
        <div class="group">
          <span id="swatches" class="swatches" role="radiogroup" aria-label="Colour"></span>
          <select id="size" aria-label="Thickness">
            <option value="1">Thin</option>
            <option value="2" selected>Medium</option>
            <option value="3">Thick</option>
          </select>
        </div>
        <div class="group">
          <button id="undo" type="button" class="ghost" disabled>Undo</button>
          <button id="redo" type="button" class="ghost" disabled>Redo</button>
        </div>
        <div id="crop-actions" class="group ghosted">
          <button id="crop-apply" type="button" class="primary compact">Apply crop</button>
          <button id="crop-cancel" type="button" class="ghost">Cancel</button>
        </div>
      </section>

      <footer class="save">
        <div class="save-row">
          <label class="name-field">
            <span class="label">File name</span>
            <div class="name-row">
              <input id="name" type="text" spellcheck="false" />
              <span class="ext" id="ext">.png</span>
            </div>
          </label>
          <label class="format-field">
            <span class="label">Format</span>
            <select id="format" aria-label="Save as format"></select>
          </label>
          <div class="save-actions">
            <button id="copy" type="button" class="ghost">Copy</button>
            <button id="save-as" type="button" class="ghost">Save as…</button>
            <button id="save" type="button" class="primary">Save</button>
          </div>
        </div>
        <div id="format-notice" class="notice info" role="status">
          <span class="ic" aria-hidden="true">ℹ</span>
          <div class="grow"><b id="notice-title"></b> <span id="notice-text"></span></div>
          <button id="use-default" type="button" class="notice-btn" hidden>Use PNG (recommended)</button>
        </div>
        <div class="save-meta"><div class="dest muted" id="dest"></div></div>
      </footer>

      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script type="module" src="./shot.ts"></script>
  </body>
</html>
