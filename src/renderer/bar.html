<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:" />
    <title>Recording</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #181b21;
        font: 13px 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e8eaee;
        user-select: none;
      }
      .bar {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 6px 0 14px;
        background: #181b21;
        border: 1px solid #2a2f39;
        -webkit-app-region: drag;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ef4444;
        flex: none;
      }
      .recording .dot {
        animation: pulse 1.2s ease-in-out infinite;
      }
      .countdown .dot,
      .saving .dot,
      .paused .dot {
        background: #f59e0b;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      #text {
        flex: 1;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        color: #fff;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        flex: none;
      }
      #stop {
        background: #ef4444;
        font-weight: 600;
      }
      #stop:hover {
        background: #dc2626;
      }
      #stop .sq {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: #fff;
      }
      .camdot {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #86efac;
        font-size: 11px;
        font-weight: 700;
        flex: none;
      }
      .camdot svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #cancel,
      #pause {
        background: #2a2f39;
        font-weight: 600;
      }
      #cancel:hover,
      #pause:hover {
        background: #3a404c;
      }
      #pause:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #pause .ico {
        display: inline-block;
        width: 9px;
        height: 11px;
      }
      #pause .ico.bars {
        border-left: 3px solid #fff;
        border-right: 3px solid #fff;
        box-sizing: border-box;
      }
      #pause .ico.play {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5.5px 0 5.5px 9px;
        border-color: transparent transparent transparent #fff;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="bar" class="bar">
      <span class="dot" aria-hidden="true"></span>
      <span id="text"></span>
      <span id="cam" class="camdot" title="The camera is recording" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3" /><path d="M16 10l5-3v10l-5-3" /></svg>Cam</span>
      <button id="cancel" type="button" title="Cancel" hidden>✕ Cancel</button>
      <button id="pause" type="button" title="Pause recording" hidden><span class="ico bars"></span><span id="pause-text">Pause</span></button>
      <button id="stop" type="button" title="Stop recording" hidden><span class="sq"></span>Stop</button>
    </div>
    <script type="module" src="./bar.ts"></script>
  </body>
</html>
