<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; media-src 'self' media:; img-src 'self' data:"
    />
    <title>Review recording</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <div class="editor">
      <header class="bar">
        <div class="title">
          <h1>Review recording</h1>
          <span id="info" class="muted"></span>
        </div>
        <div class="title-actions">
          <button id="discard" type="button" class="danger-ghost">Discard</button>
        </div>
      </header>

      <div class="work">
        <nav id="rail" class="rail" aria-label="Tools"></nav>
        <aside id="drawer" class="drawer" aria-label="Add things"></aside>
        <section class="stage-wrap">
          <div id="stage" class="stage">
            <div id="frame" class="frame">
              <div id="layers" class="layers"></div>
              <div id="pips" class="pips"></div>
              <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
              <div id="sel" class="sel-box" hidden></div>
              <div id="crop" class="crop" hidden>
                <div id="crop-box" class="crop-box">
                  <span class="crop-size" id="crop-size"></span>
                  <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i>
                  <i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
                </div>
              </div>
            </div>
            <div id="stage-msg" class="stage-msg" hidden></div>
          </div>
          <div class="transport">
            <button id="play" type="button" class="icon-btn" aria-label="Play">
              <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            </button>
            <span id="time" class="time">0:00.0 / 0:00.0</span>
            <span class="spacer"></span>
            <span class="hint">Drag things on the video to move them · corner handles resize</span>
          </div>
        </section>
        <aside id="props" class="props" aria-label="Settings for the selected thing"></aside>
      </div>

      <section class="tl-wrap">
        <div class="tl-tools">
          <button id="split" type="button" class="ghost" title="Cut the piece at the playhead (S)">✂ Split here <kbd>S</kbd></button>
          <button id="delete-sel" type="button" class="ghost" title="Delete the selected piece, comment or sound (Delete)">Delete <kbd>Del</kbd></button>
          <button id="duplicate-sel" type="button" class="ghost" title="Make a copy of the selected piece, comment or sound (Ctrl+D)">Duplicate <kbd>Ctrl+D</kbd></button>
          <button id="undo" type="button" class="ghost" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo" type="button" class="ghost" title="Redo (Ctrl+Y)">Redo</button>
          <span class="spacer"></span>
          <button id="add-media-bar" type="button" class="ghost">+ Add videos or pictures</button>
          <button id="add-music-bar" type="button" class="ghost">♪ Add audio</button>
          <label class="zoom">Zoom <input id="tl-zoom" type="range" min="0" max="100" step="1" value="40" aria-label="Timeline zoom" /></label>
        </div>
        <div id="timeline" class="timeline" aria-label="Timeline"></div>
      </section>

      <footer class="save">
        <div class="save-row">
          <label class="name-field">
            <span class="label">File name</span>
            <div class="name-row">
              <input id="name" type="text" spellcheck="false" />
              <span class="ext" id="ext">.mp4</span>
            </div>
          </label>
          <label class="format-field">
            <span class="label">Format</span>
            <select id="format" aria-label="Save as format"></select>
          </label>
          <div class="save-actions">
            <button id="save-as" type="button" class="ghost">Save as…</button>
            <button id="save" type="button" class="primary">Save</button>
          </div>
        </div>
        <div id="format-notice" class="notice" role="status" hidden>
          <span class="ic" aria-hidden="true">⚠</span>
          <div class="grow"><b id="notice-title"></b> <span id="notice-text"></span></div>
          <button id="use-default" type="button" class="notice-btn">Use MP4 (recommended)</button>
        </div>
        <div class="save-meta">
          <label id="compat-row" class="compat" hidden>
            <input id="compat" type="checkbox" checked />
            <span>Make it play everywhere (recommended) <span class="muted">— this is a Studio 4:4:4 recording, which Windows Media Player, phones and the web can’t open. Untick to keep the 4:4:4 file for VLC or a video editor.</span></span>
          </label>
          <div class="dest muted" id="dest"></div>
        </div>
      </footer>

      <div id="modal" class="modal" hidden></div>
      <div id="busy" class="busy" hidden>
        <div class="busy-card">
          <strong id="busy-title">Saving…</strong>
          <div class="progress"><span id="busy-bar"></span></div>
          <span id="busy-detail" class="muted"></span>
          <button id="busy-cancel" type="button" class="ghost">Cancel</button>
        </div>
      </div>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
