appId: com.shaunownhouse.screensnap
productName: Screen Snap
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - '!resources/mac/mac-helper'
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
afterPack: scripts/after-pack.cjs

win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces in file names: the update feed refers to files by name, and GitHub rewrites spaces to dots.
  artifactName: Screen-Snap-Setup-${version}.${ext}
portable:
  artifactName: Screen-Snap-Portable-${version}.${ext}
# Microsoft Store package. identityName / publisher / publisherDisplayName / displayName come from
# Partner Center → Product identity, passed in by CI from repository variables.
appx:
  applicationId: ScreenSnap
  backgroundColor: '#101216'
  languages:
    - en-US
  showNameOnTiles: true
  artifactName: Screen-Snap-Store-${version}.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.video
  # Signs with a Developer ID when CSC_LINK is provided (and notarises when APPLE_ID etc. are set);
  # otherwise CI disables signing and after-pack.cjs applies an ad-hoc signature instead.
  hardenedRuntime: true
  entitlements: scripts/entitlements.mac.plist
  entitlementsInherit: scripts/entitlements.mac.plist
  target:
    - dmg
  extraResources:
    - from: resources/mac/mac-helper
      to: bin/mac-helper
  extendInfo:
    NSMicrophoneUsageDescription: Screen Snap uses your microphone when you choose to record your voice.
    NSAudioCaptureUsageDescription: Screen Snap records your computer's sound when you turn on Computer sound.
  minimumSystemVersion: '11.0'
dmg:
  artifactName: Screen-Snap-${version}-mac-${arch}.${ext}
