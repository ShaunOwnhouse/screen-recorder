appId: com.shaunownhouse.screenrecorder
productName: Screen Recorder
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - '!resources/mac/mac-helper'
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
afterPack: scripts/after-pack.cjs

win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.video
  # Signs with a Developer ID when CSC_LINK is provided (and notarises when APPLE_ID etc. are set);
  # otherwise CI disables signing and after-pack.cjs applies an ad-hoc signature instead.
  hardenedRuntime: true
  entitlements: scripts/entitlements.mac.plist
  entitlementsInherit: scripts/entitlements.mac.plist
  target:
    - dmg
  extraResources:
    - from: resources/mac/mac-helper
      to: bin/mac-helper
  extendInfo:
    NSMicrophoneUsageDescription: Screen Recorder uses your microphone when you choose to record your voice.
    NSAudioCaptureUsageDescription: Screen Recorder records your computer's sound when you turn on Computer sound.
  minimumSystemVersion: '11.0'
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
